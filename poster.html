<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>49 - Focus Booster</title>
  <meta name="theme-color" content="#12110f">
  <!-- The QR code on the printed posters (marketing/posters in the source repo) opens this page. It sends
       TelemetryDeck one anonymous Poster.opened event (a random number made for this visit only, no cookie,
       with the kind of phone: ios, android or other), then forwards: an Android phone to the Android test's steps (the closed test on Google Play)
       on the Polish home page, anything else to the posters' own TestFlight link (the Poster group, from 2026-11-04),
       so Apple counts who joined through a poster. One code serves both phones.
       stats/collect.py counts the events as poster scans, apart from players.
       At App Store launch, point IPHONE at the App Store with a campaign tag (ct=poster): printed posters keep
       working and App Analytics counts their downloads. When 49 comes to Android, point ANDROID at Google Play. -->
  <meta http-equiv="refresh" content="3; url=https://testflight.apple.com/join/GywX8ZwT">
  <script>
    (function () {
      var IPHONE = 'https://testflight.apple.com/join/GywX8ZwT'
      var ANDROID = 'pl/#android'
      var ua = navigator.userAgent
      var platform = /Android/i.test(ua) ? 'android'
        : (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) ? 'ios' : 'other'
      var TARGET = platform === 'android' ? ANDROID : IPHONE
      if (platform === 'android') {
        document.addEventListener('DOMContentLoaded', function () {
          document.getElementById('going').textContent = 'Otwieram testy na Androida.'
          var button = document.getElementById('go')
          button.textContent = 'Pokaż, jak dołączyć'
          button.href = ANDROID
        })
      }
      var gone = false
      function go() { if (!gone) { gone = true; location.replace(TARGET) } }
      setTimeout(go, 800)
      try {
        var visit = crypto.randomUUID()
        crypto.subtle.digest('SHA-256', new TextEncoder().encode(visit)).then(function (hash) {
          var user = Array.from(new Uint8Array(hash), function (b) { return b.toString(16).padStart(2, '0') }).join('')
          var signal = { appID: '361CD1BB-D313-4E3A-9185-B3752B50B3E1', clientUser: user, sessionID: visit, type: 'Poster.opened',
                         payload: { platform: platform } }
          if (location.hostname !== '49game.github.io') signal.isTestMode = true
          return fetch('https://nom.telemetrydeck.com/v2/', {
            method: 'POST', mode: 'cors', keepalive: true,
            headers: { 'Content-Type': 'application/json' }, body: JSON.stringify([signal])
          })
        }).then(go, go)
      } catch (e) { go() }
    })()
  </script>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/tab-49b-64.png">
  <link rel="apple-touch-icon" href="assets/home-icon-180.png">
  <style>
    html, body { margin: 0; background: #12110f; color: #ecebe6; }
    body { font: 18px/1.5 "Helvetica Neue", Arial, sans-serif; display: grid; place-items: center; min-height: 100svh; padding: 0 16px; box-sizing: border-box; text-align: center; }
    a { color: #cfa665; }
    .button { display: inline-block; margin-top: 16px; padding: 12px 22px; background: #cfa665; color: #12110f; text-decoration: none; font-weight: 600; }
    small { display: block; margin-top: 24px; color: #bdb5a7; }
  </style>
</head>
<body>
  <main>
    <p id="going">Otwieram betę 49 w TestFlight.</p>
    <a class="button" id="go" href="https://testflight.apple.com/join/GywX8ZwT">Dołącz do bety</a>
    <small>Masz Androida? <a href="pl/#android">Dołącz do testów</a></small>
    <small>Więcej o grze: <a href="pl/">49game.github.io/pl</a></small>
  </main>
</body>
</html>
