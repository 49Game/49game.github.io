       posters' own TestFlight link, the Poster group). One code serves both phones.
       stats/collect.py counts the events as poster scans, apart from players.
       The App Store link carries App Analytics' campaign tags (pt=129629049, the provider id; ct=poster, since
       2026-11-12), so poster downloads show under Analytics, Acquisition, Campaigns. Keep the three copies alike. When 49 comes to Android, point ANDROID at Google Play. -->
