# Every day: the App Store rating on the home pages (.github/rating.py), published only when it changed.
name: App Store rating
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  rating:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/rating.py
      - name: Publish if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "No change"; exit 0; fi
          git -c user.name="49 - Focus Booster" -c user.email="hello@49game.invalid" commit -qam "The App Store rating, as of $(date -u +%F)"
          git push -q
          # A push made by this workflow's token may not start a Pages build by itself, so ask for one.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages build request failed, the next push builds it"
