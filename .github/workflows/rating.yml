# Every day at 4:20 Polish time: the App Store rating on the home pages (.github/rating.py), published only when it changed.
# GitHub's schedules are in UTC, and 4:20 in Poland is 03:20 UTC in winter (CET) and 02:20 UTC in summer (CEST),
# so both are scheduled and the run that isn't 4:20 in Poland that day stops at the first step.
name: App Store rating
on:
  schedule:
    - cron: '20 2 * * *'
    - cron: '20 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  rating:
    runs-on: ubuntu-latest
    steps:
      - name: Only at 4:20 in Poland
        id: when
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          offset=$(TZ=Europe/Warsaw date +%z)
          if { [ "$offset" = "+0100" ] && [ "${{ github.event.schedule }}" = "20 3 * * *" ]; } || \
             { [ "$offset" = "+0200" ] && [ "${{ github.event.schedule }}" = "20 2 * * *" ]; }; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Not 4:20 in Poland today on this schedule, the other one runs"
          fi
      - if: steps.when.outputs.run == 'yes'
        uses: actions/checkout@v4
      - if: steps.when.outputs.run == 'yes'
        run: python3 .github/rating.py
      - name: Publish if it changed
        if: steps.when.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "No change"; exit 0; fi
          git -c user.name="49 - Focus Booster" -c user.email="hello@49game.invalid" commit -qam "The App Store rating, as of $(date -u +%F)"
          git push -q
          # A push made by this workflow's token may not start a Pages build by itself, so ask for one.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages build request failed, the next push builds it"
